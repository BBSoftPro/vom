repository_dir=repository
common_selectors_file_name=common_selectors
appium_platform=automate

locale_languages=english;georgian

# Capabilities JSON path (relative to project root or resources directory)
capabilities_json_path=capabilities.json

# Timeouts in seconds
implicitly_wait_time_in_seconds=0
explicitly_wait_time_in_seconds=10
nullable_explicitly_wait_time_in_seconds=1

# Scroll settings
default_scroll_duration_in_millis=100
default_scroll_length=300

# Drag duration in milliseconds
drag_duration_in_millis=100